spring.application.name=hr
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.generate-ddl:false
spring.jpa.hibernate.ddl-auto:none
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1;BUILTIN_ALIAS_OVERRIDE=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql:true
#logging.level.root=debug
#logging.level.root=debug
# mock key
security.jwt.secret-key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
# 1h in millisecond
security.jwt.expiration-time=3600000
allowedOrigins=https://localhost:8085,https://localhost:8084
senior.yoe=10
spring.jpa.properties.hibernate.jdbc.batch_size=350
payroll.cron=-