spring.application.name=hr
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
payroll.cron=*/5 0 0 * * ?
senior.yoe=10
# mock key
security.jwt.secret-key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
# 1h in millisecond
security.jwt.expiration-time=3600000
allowedOrigins=https://localhost:8085,https://localhost:8084
