spring.application.name=hr
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.config.import=file:env.properties
spring.jpa.generate-ddl:false
spring.jpa.hibernate.ddl-auto:validate
spring.datasource.url=${URL}
spring.datasource.username=${myUSERNAME}
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql:true
management.endpoints.web.exposure.include=prometheus
payroll.cron=*/20 * * * * ?
#logging.level.root=debug
spring.jpa.properties.hibernate.jdbc.batch_size=350
#spring.jpa.properties.hibernate.order_inserts=true
# Hibernate SQL logging
#spring.jpa.properties.hibernate.format_sql=true
# JDBC batching info
#logging.level.org.hibernate.engine.jdbc.batch=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
senior.yoe=10
security.jwt.secret-key=${mySecretKey}
# 1h in millisecond
security.jwt.expiration-time=3600000
allowedOrigins=https://localhost:8085,https://localhost:8084

